function workerLabel(n,txt){if(n.labelText===txt)return;n.labelText=txt;if(!n.label){let c=document.createElement('canvas');c.width=512;c.height=100;n.labelCanvas=c;n.label=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),depthTest:false}));n.label.position.set(0,2.15,0);n.label.scale.set(3.4,.66,1);n.g.add(n.label)}let c=n.labelCanvas,ctx=c.getContext('2d');ctx.clearRect(0,0,512,100);ctx.fillStyle='#294936';ctx.fillRect(0,0,512,100);ctx.fillStyle='white';ctx.font='bold 35px sans-serif';ctx.textAlign='center';ctx.fillText(txt,256,63);n.label.material.map.needsUpdate=true}
const caps=()=>state.store?30*state.store:0;
function refreshIndustry(){for(let [k] of specs){visuals[k].locked.visible=!state[k];visuals[k].built.visible=!!state[k];if(workers[k])workers[k].g.visible=!!state[k]}rawPile.visible=!!state.worker;stockPile.visible=!!state.store;rawPile.children.forEach((m,i)=>m.visible=i<state.raw);stockPile.children.forEach((m,i)=>m.visible=i<Math.ceil(12*state.stock/Math.max(1,caps())));$('flow').textContent='Wald '+state.raw+'/12 · Lager '+state.stock+'/'+caps()+' · Bretter '+state.boards+'/20 · Waren '+state.goods+'/20';for(let [k,name,cost,deps] of specs){let b=$('build-'+k),price=cost*(state[k]+1);b.textContent=name+' '+(state[k]?'Lv. '+state[k]+' → '+(state[k]+1):'bauen')+' · '+price+' $';if(deps.some(d=>!state[d]))b.textContent+=' (benötigt '+deps.filter(d=>!state[d]).map(d=>specs.find(a=>a[0]===d)[1]).join(', ')+')';b.disabled=state.money<price||deps.some(d=>!state[d])||state[k]>=5}}
for(let [k,name,cost,deps] of specs){let b=document.createElement('button');b.id='build-'+k;$('builds').append(b);b.onclick=()=>{if(deps.some(d=>!state[d])||state[k]>=5)return;buy(cost*(state[k]+1),()=>state[k]++);refreshIndustry()}}$('industry').onclick=()=>{$('panel').hidden=!$('panel').hidden;reset();refreshIndustry()};$('closePanel').onclick=()=>$('panel').hidden=true;if(state.pending){workers.carrier.load=state.pending;workers.carrier.mode='return';workers.carrier.cargo.visible=true}refreshIndustry();
function moveNPC(w,x,z,dt){let p=w.g.position,dx=x-p.x,dz=z-p.z,d=Math.hypot(dx,dz);if(d<.12){w.legs.forEach(l=>l.rotation.x=0);return true}let step=Math.min(d,dt*3.3);p.x+=dx/d*step;p.z+=dz/d*step;w.g.rotation.y=Math.atan2(dx,dz);w.phase+=dt*9;w.legs.forEach((l,i)=>l.rotation.x=Math.sin(w.phase)*(i?1:-1)*.45);return false}
function industryTick(dt){let w=workers.worker,c=workers.carrier;if(state.worker){if(w.mode==='seek'){if(state.raw<=9){workerLabel(w,'Suche Baum');if(!w.target||w.target.dead){w.target=trees.filter(t=>!t.dead).sort((a,b)=>Math.hypot(a.x-w.g.position.x,a.z-w.g.position.z)-Math.hypot(b.x-w.g.position.x,b.z-w.g.position.z))[0]}let t=w.target;if(t){let dx=w.g.position.x-t.x,dz=w.g.position.z-t.z,d=Math.hypot(dx,dz)||1;if(d<1.2||moveNPC(w,t.x+dx/d,t.z+dz/d,dt)){w.g.rotation.y=Math.atan2(t.x-w.g.position.x,t.z-w.g.position.z);workerLabel(w,'Fälle Baum');w.chop+=dt*state.worker;w.arm.rotation.x=Math.sin(w.chop*7)*1.1;if(w.chop>=2.4){t.dead=true;t.timer=0;w.chop=0;w.target=null;w.mode='return';w.cargo.visible=true}}}else workerLabel(w,'Warte auf Bäume')}else{workerLabel(w,'Holzplatz voll');w.legs.forEach(l=>l.rotation.x=0)}}else if((workerLabel(w,'Bringe Holz'),moveNPC(w,14.3,6.3,dt))){state.raw=Math.min(12,state.raw+3);w.cargo.visible=false;w.mode='seek';save()}}if(state.carrier){if(c.mode==='seek'){let room=state.store?caps()-state.stock:Infinity;if(room<=0){workerLabel(c,'Lager voll');c.legs.forEach(l=>l.rotation.x=0)}else if(!state.raw){workerLabel(c,'Warte auf Holz');c.legs.forEach(l=>l.rotation.x=0)}else{workerLabel(c,'Hole Holz');if(moveNPC(c,14.3,6.3,dt)){c.load=Math.min(state.raw,room,3*state.carrier);state.raw-=c.load;state.pending=c.load;state.pendingTarget=state.store?'store':'sell';c.cargo.visible=true;c.mode='return';save()}}}else{let toStore=state.pendingTarget!=='sell'&&state.store;workerLabel(c,toStore?'Zum Holzlager':'Zum Verkauf');if(moveNPC(c,toStore?18:sellX,toStore?10:sellZ,dt)){if(toStore)state.stock+=c.load;else state.money+=3*c.load;state.pending=0;delete state.pendingTarget;c.cargo.visible=false;c.mode='seek';save();hud()}}}if(state.mill&&state.stock>0&&state.boards<=18){millWheel.rotation.y+=dt*5;processClock+=dt*state.mill;if(processClock>=2){processClock=0;state.stock--;state.boards+=2;save()}}if(state.belt){if(state.boards&&state.goods<20)beltClock+=dt*state.belt;for(let i=0;i<conveyor.length;i++){conveyor[i].visible=state.boards>0||state.goods>0;conveyor[i].position.z=-2.3+(beltClock*1.3+i*1.6)%4.6}if(beltClock>=2&&state.boards&&state.goods<20){beltClock=0;state.boards--;state.goods++;save()}}if(state.market&&state.goods){marketClock+=dt*state.market;if(marketClock>=1){marketClock=0;state.goods--;state.money+=5;save();hud()}}uiClock+=dt;if(uiClock>.4){uiClock=0;refreshIndustry();}}
let last=performance.now(),frames=0,elapsed=0;function frame(now){let raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;az+=(targetAz-az)*(1-Math.exp(-8*dt));dist+=(targetDist-dist)*(1-Math.exp(-7*dt));let vx=(Math.cos(az)*joy.x+Math.sin(az)*joy.y)*5,vz=(-Math.sin(az)*joy.x+Math.cos(az)*joy.y)*5;vel.x+=(vx-vel.x)*(1-Math.exp(-15*dt));vel.y+=(vz-vel.y)*(1-Math.exp(-15*dt));let p=player.position,nx=p.x+vel.x*dt,nz=p.z+vel.y*dt;if(!blocked(nx,p.z))p.x=nx;else vel.x=0;if(!blocked(p.x,nz))p.z=nz;else vel.y=0;let speed=vel.length();if(speed>.08){let a=Math.atan2(vel.x,vel.y)-player.rotation.y;player.rotation.y+=Math.atan2(Math.sin(a),Math.cos(a))*(1-Math.exp(-18*dt));phase+=dt*speed*3.4}let swing=Math.min(1,speed/3)*Math.sin(phase)*.65;for(let l of limbs){l.leg.rotation.x=l.i*swing;l.arm.rotation.x=-l.i*swing*.75;l.knee.rotation.x=Math.max(0,-l.i*Math.sin(phase))*Math.min(1,speed/3)*.32}body.position.y=Math.abs(swing)*.07;body.rotation.z=Math.cos(phase)*Math.min(1,speed/3)*.045;body.rotation.x=Math.min(1,speed/5)*.065;gameplay(dt,speed);industryTick(dt);follow.lerp(p,1-Math.exp(-8*dt));camera.position.set(follow.x+Math.sin(az)*dist,dist*.88,follow.z+Math.cos(az)*dist);camera.lookAt(follow.x,.8,follow.z);sun.position.set(follow.x-15,24,follow.z+12);sun.target.position.copy(follow);renderer.render(scene,camera);frames++;elapsed+=raw;if(elapsed>=1){$('fps').textContent=Math.round(frames/elapsed)+' FPS';frames=0;elapsed=0}requestAnimationFrame(frame)}status.remove();requestAnimationFrame(frame)}catch(e){status.textContent='3D-Start fehlgeschlagen: '+e.message;console.error(e)}
